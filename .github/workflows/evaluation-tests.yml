name: Evaluation harness offline tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  metric-selection:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install 'ruff==0.17.4'
      - name: Run metric regressions without cloud or model dependencies
        run: python -m unittest discover -s 0_model_customization_recipes/supervised_finetuning/sagemaker_code/evaluation_harness/tests -v
      - name: Lint metric selection and tests
        run: ruff check --isolated --select E4,E7,E9,F 0_model_customization_recipes/supervised_finetuning/sagemaker_code/evaluation_harness/{src/evalharness/evaluate.py,tests}
      - name: Check metric selection formatting
        run: ruff format --isolated --check 0_model_customization_recipes/supervised_finetuning/sagemaker_code/evaluation_harness/{src/evalharness/evaluate.py,tests}
