name: Offline regression tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  batch-resource-utils:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test dependencies
        run: python -m pip install 'boto3>=1.42.76,<2' 'PyYAML>=6,<7' 'ruff==0.17.4'
      - name: Test Batch resource helpers without AWS calls
        run: python -m unittest discover -s 6_use_cases/usecases/llm_customization_job_governance/smtj_batch_utils/tests -v
      - name: Lint maintained Batch helpers
        run: ruff check --isolated --select E4,E7,E9,F 6_use_cases/usecases/llm_customization_job_governance/smtj_batch_utils/{config.py,queue_manager.py,tests}
      - name: Check Batch formatting
        run: ruff format --isolated --check 6_use_cases/usecases/llm_customization_job_governance/smtj_batch_utils/{config.py,queue_manager.py,tests}
